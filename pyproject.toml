[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scrum-agent"
version = "0.1.0"
description = "Scrum Master Jira assistant - personal pilot (Week 3: conversational agent)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-adk==2.10.0",
    "anthropic>=0.78,<2",
    "fastapi>=0.138,<1",
    "uvicorn>=0.49,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25,<2",
    "ruff==0.16.9",
    "pre-commit>=4.0,<5",
]

[project.scripts]
scrum-agent = "scrum_agent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scrum_agent = [
    "web/templates/*.html",
    "web/static/*",
    "migrations/*.sql",
    "drafting/ticket_templates/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning:opentelemetry.util._importlib_metadata",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.JSON_SCHEMA_FOR_FUNC_DECL is enabled:UserWarning:google.adk.models.llm_request",
]
